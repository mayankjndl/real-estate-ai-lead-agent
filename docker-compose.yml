services:
  postgres:
    image: postgres:18
    container_name: pg-local
    environment:
      POSTGRES_USER: realestate
      POSTGRES_PASSWORD: localpass
      POSTGRES_DB: realestate_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    restart: always

  redis:
    image: redis:8.8.0
    container_name: redis-local
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    restart: always

  neo4j:
    image: neo4j:2026.06
    container_name: neo4j-local
    environment:
      NEO4J_AUTH: neo4j/localpass
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4jdata:/data
    restart: always

  ngrok:
    image: ngrok/ngrok:3
    container_name: ngrok-local
    command:
      - "http"
      - "host.docker.internal:8000"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    restart: always

  frontend:
    image: node:24
    container_name: frontend-local
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://host.docker.internal:8000
    command: sh -c "npm install && npm run dev"
    restart: always

  # Ops plane (optional). UI: http://localhost:5678 — create owner account on first visit.
  # Delivery: API n8n_bridge (group ireios-n8n) POSTs envelopes to /webhook/* — not Redis Streams.
  # Host .env: N8N_API_KEY = webhook Header Auth secret (Authorization: Bearer …).
  # Host .env: N8N_MANAGEMENT_API_KEY = JWT from n8n Settings → n8n API (import script only).
  # Do NOT pass the webhook secret as a container env named N8N_API_KEY — n8n ignores it for /api/v1.
  # Gmail-first recipes: plans/phase3/N8N_LIVE_WORKFLOWS_PLAN.md · docs/N8N_INTEGRATION.md
  n8n:
    image: n8nio/n8n:2.31.5
    container_name: n8n-local
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_WEBHOOK_URL: http://localhost:5678/
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      # Persist encrypted credentials across restarts (local dev only — change in prod)
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-ireios-local-n8n-encryption-key}
    volumes:
      - n8ndata:/home/node/.n8n
    restart: always

volumes:
  pgdata:
  redisdata:
  neo4jdata:
  n8ndata: